name: Release artifacts

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Verify source
        run: make verify
      - name: Build archives
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            directory="lockfile-review_${version}_${os}_${arch}"
            mkdir -p "dist/$directory"
            binary="lockreview"
            if [[ "$os" == windows ]]; then
              binary="lockreview.exe"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=$version" \
              -o "dist/$directory/$binary" ./cmd/lockreview
            cp LICENSE README.md "dist/$directory/"
            if [[ "$os" == windows ]]; then
              (cd dist && zip -qr "$directory.zip" "$directory")
            else
              tar -C dist -czf "dist/$directory.tar.gz" "$directory"
            fi
            rm -r "dist/$directory"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
